name: Build Cross-Platform Releases (Windows .exe & Linux .deb)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Windows yt-dlp.exe & static FFmpeg (Video/Audio Merger)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          
          # Download static ffmpeg and ffprobe for Windows
          Write-Host "Downloading static FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | ForEach-Object { Copy-Item $_.FullName "bin/ffmpeg.exe" -Force }
          Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | ForEach-Object { Copy-Item $_.FullName "bin/ffprobe.exe" -Force }
          Remove-Item -Recurse -Force "ffmpeg-temp"
          Remove-Item -Force "ffmpeg.zip"

      - name: Build SIDM Core (Windows x64)
        run: |
          cd sidm-core
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Binary for Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "sidm-core/target/release"
          Copy-Item "sidm-core/target/x86_64-pc-windows-msvc/release/sidm-core.exe" "sidm-core/target/release/sidm-core.exe"

      - name: Compile Inno Setup Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/sidm_setup.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          $portableDir = "dist/SIDM_v1.1.3_Portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          New-Item -ItemType Directory -Force -Path "$portableDir/bin"
          Copy-Item "sidm-core/target/release/sidm-core.exe" "$portableDir/sidm-core.exe"
          Copy-Item "bin/yt-dlp.exe" "$portableDir/bin/yt-dlp.exe"
          Copy-Item "bin/yt-dlp.exe" "$portableDir/yt-dlp.exe"
          Copy-Item "bin/ffmpeg.exe" "$portableDir/bin/ffmpeg.exe"
          Copy-Item "bin/ffmpeg.exe" "$portableDir/ffmpeg.exe"
          Copy-Item "bin/ffprobe.exe" "$portableDir/bin/ffprobe.exe"
          Copy-Item "bin/ffprobe.exe" "$portableDir/ffprobe.exe"
          Copy-Item "start_sidm.bat" "$portableDir/start_sidm.bat"
          Copy-Item "start_sidm.ps1" "$portableDir/start_sidm.ps1"
          Copy-Item "start_sidm_silent.vbs" "$portableDir/start_sidm_silent.vbs"
          Copy-Item -Recurse "sidm-extension" "$portableDir/sidm-extension"
          Copy-Item -Recurse "installer" "$portableDir/installer"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/SIDM_v1.1.3_Portable_Windows_x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/SIDM_v1.1.3_Setup.exe
            dist/SIDM_v1.1.3_Portable_Windows_x64.zip

  build-linux:
    name: Build Linux (.deb Package & Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux yt-dlp
        run: |
          mkdir -p bin
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o bin/yt-dlp
          chmod +x bin/yt-dlp

      - name: Build SIDM Core (Linux x64)
        run: |
          cd sidm-core
          cargo build --release

      - name: Build Debian/Ubuntu Package (.deb)
        run: |
          chmod +x installer/build_deb.sh
          ./installer/build_deb.sh

      - name: Create Linux Tarball Package (.tar.gz) & Extension Zip
        run: |
          mkdir -p dist/sidm_1.1.3_linux_x64
          cp sidm-core/target/release/sidm-core dist/sidm_1.1.3_linux_x64/
          cp bin/yt-dlp dist/sidm_1.1.3_linux_x64/
          cp start_sidm.sh dist/sidm_1.1.3_linux_x64/
          cp -r sidm-extension dist/sidm_1.1.3_linux_x64/
          tar -czf dist/sidm_1.1.3_linux_x64.tar.gz -C dist sidm_1.1.3_linux_x64
          (cd sidm-extension && zip -r ../dist/sidm-extension-v1.1.3.zip ./*)

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            dist/sidm_1.1.3_amd64.deb
            dist/sidm_1.1.2_amd64.deb
            dist/sidm_1.1.1_amd64.deb
            dist/sidm_1.1.0_amd64.deb
            dist/sidm_1.0.0_amd64.deb
            dist/sidm_1.1.3_linux_x64.tar.gz
            dist/sidm-extension-v1.1.3.zip

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: dist-release

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: dist-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.3
          name: "⚡ SIDM v1.1.3 Hybrid Release (Windows & Linux)"
          body: |
            ## ⚡ SIDM - Smart Internet Download Manager (v1.1.3)

            Commercial-grade high-speed Internet Download Manager with modern multi-stream acceleration, universal video sniffer, custom folder selection, unified audio/video muxing, and native OS integration.

            ### 🚀 What's New in v1.1.3:
            - **🎬 100% Fixed Video & Audio Muxing**: Fixed issue where YouTube videos left separate video (`.f137.mp4`) and audio (`.f140.m4a`) files. Stripped Windows UNC `\\?\` prefix from FFmpeg paths, added direct PATH injection into child processes, and implemented automatic post-download FFmpeg fallback muxing.
            - **🪟 Windows Installer Elevation Fix**: Fixed `RegCreateKeyEx failed; code 5. Access is denied` error when installing or upgrading on existing PCs by removing restricted policy keys and adding safe graceful overrides.
            - **🛡️ YouTube 429 Subtitle Rate-Limiting Protection**: Guaranteed subtitle-free streaming requests to prevent YouTube bot rate-limits.
            - **📁 Custom Folder Picker**: Seamlessly select download destinations via native Windows FolderBrowserDialog or Linux file pickers.

            ---

            ### 📥 Downloads:

            #### 🪟 Windows (Windows 10 / 11):
            - **`SIDM_v1.1.3_Setup.exe`** — **Recommended for Windows users**. Single-click installer with automatic browser integration and bundled FFmpeg.
            - **`SIDM_v1.1.3_Portable_Windows_x64.zip`** — Standalone portable archive (no installation required).

            #### 🐧 Linux (Zorin OS / Ubuntu / Debian / Linux Mint):
            - **`sidm_1.1.3_amd64.deb`** — **Recommended for Debian/Ubuntu users**. Double-click or `sudo dpkg -i sidm_1.1.3_amd64.deb`.
            - **`sidm_1.1.3_linux_x64.tar.gz`** — Standalone Linux x64 portable archive.
            - **`sidm-extension-v1.1.3.zip`** — Standalone extension package for Chrome, Edge, and Brave.
          draft: false
          prerelease: false
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
