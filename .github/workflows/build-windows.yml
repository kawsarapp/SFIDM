name: Build Windows Installer (SIDM_Setup.exe)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Bundled yt-dlp.exe for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"

      - name: Build SIDM Core Release Binary (Windows x64)
        run: |
          cd sidm-core
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Binary for Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "sidm-core/target/release"
          Copy-Item "sidm-core/target/x86_64-pc-windows-msvc/release/sidm-core.exe" "sidm-core/target/release/sidm-core.exe"

      - name: Compile Inno Setup Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/sidm_setup.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          $portableDir = "dist/SIDM_v1.0.0_Portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item "sidm-core/target/release/sidm-core.exe" "$portableDir/sidm-core.exe"
          Copy-Item "bin/yt-dlp.exe" "$portableDir/yt-dlp.exe"
          Copy-Item "start_sidm.bat" "$portableDir/start_sidm.bat"
          Copy-Item "start_sidm.ps1" "$portableDir/start_sidm.ps1"
          Copy-Item -Recurse "sidm-extension" "$portableDir/sidm-extension"
          Copy-Item -Recurse "installer" "$portableDir/installer"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/SIDM_v1.0.0_Portable_Windows_x64.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SIDM_v1.0.0_Windows_x64_Installer
          path: |
            dist/SIDM_v1.0.0_Setup.exe
            dist/SIDM_v1.0.0_Portable_Windows_x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "⚡ SIDM v1.0.0 Commercial Release (Windows 1-Click Setup)"
          body: |
            ## ⚡ SIDM - Smart Internet Download Manager (v1.0.0)

            The ultimate high-speed Internet Download Manager with modern multi-stream acceleration and universal video extraction.

            ### 🚀 What's Included:
            - **1-Click Windows Setup (`SIDM_v1.0.0_Setup.exe`)**: Installs SIDM and auto-registers the integration extension in **Google Chrome**, **Microsoft Edge**, and **Brave**.
            - **Extreme 32-64 Thread Multi-Segment Engine**: 16x speed acceleration surpassing traditional IDM.
            - **Universal Browser Floating Button**: 1-click video downloader for YouTube, Facebook Reels/Videos, TikTok, and HTML5 video.
            - **Draggable & Minimizable Live Progress Card**: Floating on-screen IDM progress card with live speed, ETA, and progress bar.
            - **1-Click Open Folder & Video**: Instant desktop file explorer and media player integration.
            - **HWID Pro Licensing**: Lifetime & annual commercial licensing engine with 14-day Pro trial.

            ### 📥 Download Options:
            1. **`SIDM_v1.0.0_Setup.exe`** (Recommended) — Double click to install on Windows.
            2. **`SIDM_v1.0.0_Portable_Windows_x64.zip`** — Standalone portable version for USB / no installation.
          draft: false
          prerelease: false
          files: |
            dist/SIDM_v1.0.0_Setup.exe
            dist/SIDM_v1.0.0_Portable_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
