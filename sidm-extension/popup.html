<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIDM Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 360px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .status-online {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }
    .status-offline {
      background: #7f1d1d;
      color: #f87171;
      border: 1px solid #dc2626;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 10px;
      color: #f8fafc;
      font-size: 12px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .task-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
    }
    .task-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .progress-bar-bg {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #38bdf8;
      width: 0%;
      transition: width 0.3s ease;
    }
    .task-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>⚡</span>
      <span>SIDM Manager</span>
    </div>
    <div id="statusBadge" class="status-badge status-offline">Connecting...</div>
  </div>

  <div class="card">
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste download URL here..." />
      <div class="btn-row">
        <button id="downloadBtn">🚀 High-Speed Download (16 Thds)</button>
      </div>
    </div>
  </div>

  <div class="section-title">Active Downloads</div>
  <div id="taskList" class="task-list">
    <div style="font-size: 11px; color: #64748b; text-align: center; padding: 12px;">
      No active downloads.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
